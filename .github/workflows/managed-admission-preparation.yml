name: Managed admission preparation
on:
  push:
    branches: [codex/97-managed-admission-preparation]
  pull_request:
    paths:
      - 'crates/nf-store/**'
      - '.github/workflows/managed-admission-preparation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  managed-admission-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify focused public admission, provider bounds and SQLite path policy
        run: cargo test -p nf-store --lib --test managed_source_admission --test managed_provider_bounds --locked --offline -- --test-threads=1
