name: Synthetic foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Install pinned Rust components
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Install vendored developer tools offline
        run: npm ci --offline --ignore-scripts --no-audit --no-fund
      - name: Format, lint, boundaries, public Rust and tooling tests, synthetic Java contracts
        run: npm run check:ci-public
      - name: Observe Java and Rust mutual authentication on both local endpoints
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :ipc:exportAuthTestClasspath --no-daemon
          $env:NF_IPC_JAVA = 'java'
          $env:NF_IPC_JAVA_CLASSPATH_FILE = Join-Path (Get-Location) 'java/ipc/build/auth-test-classpath.txt'
          cargo test -p nf-ipc --test java_process --locked --offline -- --ignored
      - name: Compare Rust shadow against actual Java reference outputs
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :nex-reference:exportDifferentialClasspath --no-daemon
          $env:NF_SHADOW_JAVA = 'java'
          $env:NF_SHADOW_CLASSPATH_FILE = Join-Path (Get-Location) 'java/nex-reference/build/differential-classpath.txt'
          cargo test -p nf-nex-shadow --test differential --locked --offline -- --ignored
      - name: Install maintained Linux sync fault injector
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
          strace --version
      - name: Observe SQLite sync failure and recovery
        if: runner.os == 'Linux'
        env:
          NF_STORE_REQUIRE_SYNC_FAULT: '1'
        run: cargo test -p nf-store --test fsync_failure --locked --offline -- --nocapture
      - name: Observe miniature SQLite sync failure and pending recovery
        if: runner.os == 'Linux'
        env:
          NF_MINIATURE_REQUIRE_SYNC_FAULT: '1'
        run: cargo test -p nf-store --test miniature_fsync_failure --locked --offline -- --nocapture
  # Fresh crate jobs keep critical I/O tests serial within the original 20-minute bound.
  critical-io-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        crate: [nf-identity, nf-transport]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Run every crate unit, integration and documentation test serially
        run: cargo test -p ${{ matrix.crate }} --locked --offline -- --test-threads=1
  # A fresh, required Windows job preserves the hosted 20-minute bound for each gate.
  windows-interop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Build fresh synthetic Java prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java syntheticCheck --no-daemon
      - name: Observe Java and Rust mutual authentication on both local endpoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :ipc:exportAuthTestClasspath --no-daemon
          $env:NF_IPC_JAVA = 'java'
          $env:NF_IPC_JAVA_CLASSPATH_FILE = Join-Path (Get-Location) 'java/ipc/build/auth-test-classpath.txt'
          cargo test -p nf-ipc --test java_process --locked --offline -- --ignored
      - name: Compare Rust shadow against actual Java reference outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :nex-reference:exportDifferentialClasspath --no-daemon
          $env:NF_SHADOW_JAVA = 'java'
          $env:NF_SHADOW_CLASSPATH_FILE = Join-Path (Get-Location) 'java/nex-reference/build/differential-classpath.txt'
          cargo test -p nf-nex-shadow --test differential --locked --offline -- --ignored
  release-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Build headless node
        run: cargo build --workspace --locked --offline --release
  # One owned synthetic observation; existing production tests and deadlines stay intact.
  private-acl-phase-observation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/receipt-main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install only vendored developer tools
        run: npm ci --offline --ignore-scripts --no-audit --no-fund
      - name: Prepare the confined diagnostic module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $taskModule = Join-Path $taskRoot 'tools/private-acl-observation'
          $taskOutput = Join-Path $taskRoot '.tmp/private-acl-observation'
          if (Test-Path -LiteralPath $taskOutput) { throw 'FRESH_DIAGNOSTIC_OUTPUT_REQUIRED' }
          [IO.Directory]::CreateDirectory($taskOutput) | Out-Null
          [IO.Directory]::CreateDirectory((Join-Path $taskModule '.agentic')) | Out-Null
          $taskProject = Get-Content -LiteralPath (Join-Path $taskRoot '.agentic/project.json') -Raw | ConvertFrom-Json -AsHashtable
          $taskProject.execution.limits.flakyReruns = 0
          $taskProject.execution.limits.semanticRepairs = 0
          $taskProject.overrides = @{ workspace = @{ commands = @{ 'node:.' = @(@{ program = (Get-Command node -CommandType Application).Source; args = @((Join-Path $taskModule 'batch.cjs')); cwd = '.' }) } } }
          $taskConfig = Join-Path $taskModule '.agentic/project.json'
          $taskStream = [IO.File]::Open($taskConfig, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
          try {
            $taskBytes = [Text.UTF8Encoding]::new($false).GetBytes(($taskProject | ConvertTo-Json -Depth 16) + [Environment]::NewLine)
            $taskStream.Write($taskBytes, 0, $taskBytes.Length)
          } finally { $taskStream.Dispose() }
      - name: Observe one original-deadline single ACL helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          npm exec -- workspace-template verify tools/private-acl-observation --scope module --module node:. --concurrency 1 --timeout 240000 --json 1> .tmp/private-acl-observation/verify.raw.json 2> .tmp/private-acl-observation/verify.stderr.txt
          exit $LASTEXITCODE
      - name: Retain bounded diagnostic records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-acl-phase-observation
          path: |
            .tmp/private-acl-observation/observation.json
            .tmp/private-acl-observation/verify.raw.json
            .tmp/private-acl-observation/verify.stderr.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
