name: Synthetic foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Install pinned Rust components
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Install vendored developer tools offline
        run: npm ci --offline --ignore-scripts --no-audit --no-fund
      - name: Retain immutable publication versions and an explicit tombstone
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_publication_history --locked --offline immutable_versions_and_tombstone_preserve_canonical_history -- --exact --nocapture
      - name: Refuse zero presentation namespace before invalid numeric domain
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_namespace --locked --offline -- --nocapture
      - name: Refuse Java zero presentation namespace before invalid numeric domain
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationNamespaceTest --no-daemon
      - name: Refuse Java null presentation namespace before null domain
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationNullNamespaceTest --no-daemon
      - name: Refuse Java null presentation domain after a valid namespace
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationNullDomainTest --no-daemon
      - name: Refuse invalid numeric presentation domains before geometric fit
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_bounds --locked --offline -- --nocapture
      - name: Refuse Java invalid numeric presentation domains before geometric fit
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationBoundsTest --no-daemon
      - name: Refuse presentation domains with insufficient grid pitch
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_fit --locked --offline -- --nocapture
      - name: Refuse Java presentation domains with insufficient grid pitch
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationFitTest --no-daemon
      - name: Refuse a real collision without creating a projectable placement
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_collision --locked --offline -- --nocapture
      - name: Refuse a Java real collision without creating a projectable placement
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationCollisionTest --no-daemon
      - name: Preserve client outputs through a real second reservation
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_second_reservation --locked --offline -- --nocapture
      - name: Preserve Java client outputs through a real second reservation
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationSecondReservationTest --no-daemon
      - name: Project unsigned boundary slots for both client layouts
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_unsigned_slots --locked --offline -- --nocapture
      - name: Project Java unsigned boundary slots for both client layouts
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationUnsignedSlotsTest --no-daemon
      - name: Project one real reservation for two client layouts
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation --locked --offline -- --nocapture
      - name: Preserve both client positions and earlier results across a real update
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_update --locked --offline -- --nocapture
      - name: Refuse projection from an empty real placement registry
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_missing --locked --offline -- --nocapture
      - name: Refuse foreign namespace before looking up a missing placement
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_foreign_namespace --locked --offline -- --nocapture
      - name: Refuse invalid keys before checking a foreign namespace
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_presentation_invalid_key --locked --offline -- --nocapture
      - name: Refuse Java null projection arguments
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationNullTest --no-daemon
      - name: Refuse Java invalid keys before checking a foreign namespace
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationInvalidKeyTest --no-daemon
      - name: Refuse Java foreign namespace before looking up a missing placement
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationForeignNamespaceTest --no-daemon
      - name: Refuse Java projection from an empty real placement registry
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationMissingTest --no-daemon
      - name: Preserve Java client positions and earlier results across a real update
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationUpdateTest --no-daemon
      - name: Project one Java real reservation for two client layouts
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPresentationTest --no-daemon
      - name: Retain Java immutable publication versions and an explicit tombstone
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPublicationHistoryTest --no-daemon
      - name: Preserve historical replay and tombstone reference across republish
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_publication_history_replay --locked --offline historical_replay_preserves_latest_and_tombstone_reference_across_republish -- --exact --nocapture
      - name: Check history admission, quota, unsigned and full key conformance
        timeout-minutes: 5
        run: cargo test -p nf-contract --test system_publication_history_conformance --locked --offline -- --nocapture
      - name: Check Java history admission, quota, unsigned and full key conformance
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPublicationHistoryConformanceTest --no-daemon
      - name: Refuse conceptual slot collision without changing existing assignment
        run: cargo test -p nf-contract --test system_placement_registry --locked --offline slot_collision_refuses_without_changing_existing_assignment -- --exact --nocapture
      - name: Refuse Java conceptual slot collision without changing existing assignment
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :contract:SystemPlacementRegistryTest --no-daemon
      - name: Format, lint, boundaries, Rust and tooling tests, synthetic Java contracts
        run: npm run check
      - name: Observe Java and Rust mutual authentication on both local endpoints
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :ipc:exportAuthTestClasspath --no-daemon
          $env:NF_IPC_JAVA = 'java'
          $env:NF_IPC_JAVA_CLASSPATH_FILE = Join-Path (Get-Location) 'java/ipc/build/auth-test-classpath.txt'
          cargo test -p nf-ipc --test java_process --locked --offline -- --ignored
      - name: Compare Rust shadow against actual Java reference outputs
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :nex-reference:exportDifferentialClasspath --no-daemon
          $env:NF_SHADOW_JAVA = 'java'
          $env:NF_SHADOW_CLASSPATH_FILE = Join-Path (Get-Location) 'java/nex-reference/build/differential-classpath.txt'
          cargo test -p nf-nex-shadow --test differential --locked --offline -- --ignored
      - name: Install maintained Linux sync fault injector
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
          strace --version
      - name: Observe SQLite sync failure and recovery
        if: runner.os == 'Linux'
        env:
          NF_STORE_REQUIRE_SYNC_FAULT: '1'
        run: cargo test -p nf-store --test fsync_failure --locked --offline -- --nocapture
      - name: Observe miniature SQLite sync failure and pending recovery
        if: runner.os == 'Linux'
        env:
          NF_MINIATURE_REQUIRE_SYNC_FAULT: '1'
        run: cargo test -p nf-store --test miniature_fsync_failure --locked --offline -- --nocapture
  # A fresh, required Windows job preserves the hosted 20-minute bound for each gate.
  windows-interop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Build fresh synthetic Java prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java syntheticCheck --no-daemon
      - name: Observe Java and Rust mutual authentication on both local endpoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :ipc:exportAuthTestClasspath --no-daemon
          $env:NF_IPC_JAVA = 'java'
          $env:NF_IPC_JAVA_CLASSPATH_FILE = Join-Path (Get-Location) 'java/ipc/build/auth-test-classpath.txt'
          cargo test -p nf-ipc --test java_process --locked --offline -- --ignored
      - name: Compare Rust shadow against actual Java reference outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :nex-reference:exportDifferentialClasspath --no-daemon
          $env:NF_SHADOW_JAVA = 'java'
          $env:NF_SHADOW_CLASSPATH_FILE = Join-Path (Get-Location) 'java/nex-reference/build/differential-classpath.txt'
          cargo test -p nf-nex-shadow --test differential --locked --offline -- --ignored
  release-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Build headless node
        run: cargo build --workspace --locked --offline --release
