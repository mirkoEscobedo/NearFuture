name: Synthetic foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Install pinned Rust components
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Install vendored developer tools offline
        run: npm ci --offline --ignore-scripts --no-audit --no-fund
      - name: Prepare retained command-query capture directory
        id: chat-command-evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or [string]::IsNullOrWhiteSpace($env:GITHUB_OUTPUT)) {
            throw 'Runner-owned temp and step output paths are required'
          }
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).ProviderPath
          $name = 'near-future-chat-command-query-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + [Guid]::NewGuid().ToString('N')
          $directory = Join-Path $runnerTemp $name
          if (Test-Path -LiteralPath $directory) { throw 'Fresh Chat evidence directory required' }
          $null = New-Item -ItemType Directory -Path $directory -ErrorAction Stop
          $directory = (Resolve-Path -LiteralPath $directory).ProviderPath
          if (-not [IO.Path]::IsPathRooted($directory)) { throw 'Absolute Chat evidence directory required' }
          $receipt = [ordered]@{
            state = 'CALLER_DIRECTORY_CREATED_NOT_TEST_SUCCESS'
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerOS = $env:RUNNER_OS
          }
          $bytes = [Text.UTF8Encoding]::new($false).GetBytes(($receipt | ConvertTo-Json) + [Environment]::NewLine)
          $file = [IO.File]::Open((Join-Path $directory 'caller.json'), [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try { $file.Write($bytes, 0, $bytes.Length); $file.Flush($true) } finally { $file.Dispose() }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('directory=' + $directory + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Prepare retained local-mute capture directory
        id: chat-local-mute-evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or [string]::IsNullOrWhiteSpace($env:GITHUB_OUTPUT)) {
            throw 'Runner-owned temp and step output paths are required'
          }
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).ProviderPath
          $name = 'near-future-chat-local-mute-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + [Guid]::NewGuid().ToString('N')
          $directory = Join-Path $runnerTemp $name
          if (Test-Path -LiteralPath $directory) { throw 'Fresh Chat evidence directory required' }
          $null = New-Item -ItemType Directory -Path $directory -ErrorAction Stop
          $directory = (Resolve-Path -LiteralPath $directory).ProviderPath
          if (-not [IO.Path]::IsPathRooted($directory)) { throw 'Absolute Chat evidence directory required' }
          $receipt = [ordered]@{
            state = 'CALLER_DIRECTORY_CREATED_NOT_TEST_SUCCESS'
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerOS = $env:RUNNER_OS
          }
          $bytes = [Text.UTF8Encoding]::new($false).GetBytes(($receipt | ConvertTo-Json) + [Environment]::NewLine)
          $file = [IO.File]::Open((Join-Path $directory 'caller.json'), [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try { $file.Write($bytes, 0, $bytes.Length); $file.Flush($true) } finally { $file.Dispose() }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('directory=' + $directory + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Prepare retained local-mute preferences capture directory
        id: chat-local-mute-preferences-evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP) -or [string]::IsNullOrWhiteSpace($env:GITHUB_OUTPUT)) {
            throw 'Runner-owned temp and step output paths are required'
          }
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).ProviderPath
          $name = 'near-future-chat-local-mute-preferences-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + [Guid]::NewGuid().ToString('N')
          $directory = Join-Path $runnerTemp $name
          if (Test-Path -LiteralPath $directory) { throw 'Fresh Chat evidence directory required' }
          $null = New-Item -ItemType Directory -Path $directory -ErrorAction Stop
          $directory = (Resolve-Path -LiteralPath $directory).ProviderPath
          if (-not [IO.Path]::IsPathRooted($directory)) { throw 'Absolute Chat evidence directory required' }
          $receipt = [ordered]@{
            state = 'CALLER_DIRECTORY_CREATED_NOT_TEST_SUCCESS'
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            runnerOS = $env:RUNNER_OS
          }
          $bytes = [Text.UTF8Encoding]::new($false).GetBytes(($receipt | ConvertTo-Json) + [Environment]::NewLine)
          $file = [IO.File]::Open((Join-Path $directory 'caller.json'), [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try { $file.Write($bytes, 0, $bytes.Length); $file.Flush($true) } finally { $file.Dispose() }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ('directory=' + $directory + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
      - name: Format, lint, boundaries, Rust and tooling tests, synthetic Java contracts
        env:
          NF_CHAT_COMMAND_QUERY_EVIDENCE_DIR: ${{ steps.chat-command-evidence.outputs.directory }}
          NF_CHAT_LOCAL_MUTE_EVIDENCE_DIR: ${{ steps.chat-local-mute-evidence.outputs.directory }}
          NF_CHAT_LOCAL_MUTE_PREFERENCES_EVIDENCE_DIR: ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $caller = @'
          'use strict';
          const fs=require('fs'),path=require('path'),cp=require('child_process'),crypto=require('crypto');
          const root=process.env.NF_CHAT_LOCAL_MUTE_EVIDENCE_DIR;
          if(!root||!path.isAbsolute(root)||!fs.lstatSync(root).isDirectory()||fs.realpathSync(root)!==root)throw Error('EXACT_OWNED_ABSOLUTE_LOCAL_MUTE_CAPTURE_DIRECTORY');
          const outPath=path.join(root,'check.original.stdout'),errPath=path.join(root,'check.original.stderr'),resultPath=path.join(root,'check.original.result.json');
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex'),pin=p=>{const b=fs.readFileSync(p);return{name:path.basename(p),bytes:b.length,sha256:sha(b)};};
          const command=process.platform==='win32'?process.env.ComSpec:'npm',args=process.platform==='win32'?['/d','/s','/c','npm run check']:['run','check'];
          if(process.platform==='win32'&&(!command||!path.isAbsolute(command)||path.basename(command).toLowerCase()!=='cmd.exe'))throw Error('EXACT_WINDOWS_NPM_COMMAND_PROCESSOR');
          let out,err,child,failure=null;const started=Date.now();
          try{out=fs.openSync(outPath,'wx');err=fs.openSync(errPath,'wx');child=cp.spawnSync(command,args,{cwd:process.cwd(),env:process.env,windowsHide:true,timeout:1200000,stdio:['ignore',out,err]});if(child.error)failure=String(child.error);}
          catch(error){failure=String(error);}
          finally{if(out!==undefined)fs.closeSync(out);if(err!==undefined)fs.closeSync(err);}
          const result={state:failure||!child||child.status!==0||child.signal?'CALLER_CHECK_FAILED_OR_INCOMPLETE_ORIGINALS_RETAINED':'CALLER_CHECK_EXIT0_TEST_RESULTS_REQUIRE_REVIEW',command,args,childStatus:child?child.status:null,childSignal:child?child.signal:null,failure,elapsedMs:Date.now()-started,maximumChildMs:1200000,workflowJobMinutesUnchanged:20,originalRustFirstAndControlsDeadlinesUnchanged:true,retries:0,stdout:fs.existsSync(outPath)?pin(outPath):null,stderr:fs.existsSync(errPath)?pin(errPath):null};
          const f=fs.openSync(resultPath,'wx');try{fs.writeFileSync(f,JSON.stringify(result,null,2)+'\n');fs.fsyncSync(f);}finally{fs.closeSync(f);}
          for(const [file,destination]of[[outPath,1],[errPath,2]]){if(fs.existsSync(file)){const b=fs.readFileSync(file);for(let offset=0;offset<b.length;){const n=fs.writeSync(destination,b,offset,b.length-offset);if(n<=0)throw Error('FULL_ORIGINAL_CALLER_FORWARD');offset+=n;}}}
          console.log(JSON.stringify(result));process.exitCode=!failure&&child&&Number.isInteger(child.status)&&child.status>=0?child.status:2;
          '@
          node -e $caller
          exit $LASTEXITCODE
      - name: Retain local-mute caller and authenticated originals after success or failure
        if: ${{ always() && steps.chat-local-mute-evidence.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-local-mute-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: |
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/caller.json
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/check.original.stdout
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/check.original.stderr
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/check.original.result.json
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/authenticated-history.before.original.sqlite
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/signed-original.before.original.bin
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/authenticated-history.after.original.sqlite
          if-no-files-found: error
          overwrite: 'false'
      - name: Retain local-mute preferences caller and owned originals after success or failure
        if: ${{ always() && steps.chat-local-mute-preferences-evidence.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-local-mute-preferences-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: |
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/caller.json
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/check.original.stdout
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/check.original.stderr
            ${{ steps.chat-local-mute-evidence.outputs.directory }}/check.original.result.json
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/authenticated-history.before.original.sqlite
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/signed-original.before.original.bin
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/local-mute.preferences.original.bin
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/authenticated-history.after.original.sqlite
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/local-mute.preferences.after-reopen.original.bin
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/controls-scope/**
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/controls-raw-cap/**
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/controls-zero/**
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/controls-corrupt/**
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/controls-bounded/**
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/controls-storage/**
            ${{ steps.chat-local-mute-preferences-evidence.outputs.directory }}/receiver-order/**
          if-no-files-found: error
          overwrite: 'false'
      - name: Retain command-query captures after success or failure
        if: ${{ always() && steps.chat-command-evidence.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chat-command-query-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: |
            ${{ steps.chat-command-evidence.outputs.directory }}/caller.json
            ${{ steps.chat-command-evidence.outputs.directory }}/command-query.stdout
            ${{ steps.chat-command-evidence.outputs.directory }}/command-query.stderr
          if-no-files-found: error
          overwrite: 'false'
      - name: Observe Java and Rust mutual authentication on both local endpoints
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :ipc:exportAuthTestClasspath --no-daemon
          $env:NF_IPC_JAVA = 'java'
          $env:NF_IPC_JAVA_CLASSPATH_FILE = Join-Path (Get-Location) 'java/ipc/build/auth-test-classpath.txt'
          cargo test -p nf-ipc --test java_process --locked --offline -- --ignored
      - name: Compare Rust shadow against actual Java reference outputs
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :nex-reference:exportDifferentialClasspath --no-daemon
          $env:NF_SHADOW_JAVA = 'java'
          $env:NF_SHADOW_CLASSPATH_FILE = Join-Path (Get-Location) 'java/nex-reference/build/differential-classpath.txt'
          cargo test -p nf-nex-shadow --test differential --locked --offline -- --ignored
      - name: Install maintained Linux sync fault injector
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
          strace --version
      - name: Observe SQLite sync failure and recovery
        if: runner.os == 'Linux'
        env:
          NF_STORE_REQUIRE_SYNC_FAULT: '1'
        run: cargo test -p nf-store --test fsync_failure --locked --offline -- --nocapture
      - name: Observe miniature SQLite sync failure and pending recovery
        if: runner.os == 'Linux'
        env:
          NF_MINIATURE_REQUIRE_SYNC_FAULT: '1'
        run: cargo test -p nf-store --test miniature_fsync_failure --locked --offline -- --nocapture
  # A fresh, required Windows job preserves the hosted 20-minute bound for each gate.
  windows-interop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.8'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Build fresh synthetic Java prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java syntheticCheck --no-daemon
      - name: Observe Java and Rust mutual authentication on both local endpoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :ipc:exportAuthTestClasspath --no-daemon
          $env:NF_IPC_JAVA = 'java'
          $env:NF_IPC_JAVA_CLASSPATH_FILE = Join-Path (Get-Location) 'java/ipc/build/auth-test-classpath.txt'
          cargo test -p nf-ipc --test java_process --locked --offline -- --ignored
      - name: Compare Rust shadow against actual Java reference outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          java -classpath java/gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p java :nex-reference:exportDifferentialClasspath --no-daemon
          $env:NF_SHADOW_JAVA = 'java'
          $env:NF_SHADOW_CLASSPATH_FILE = Join-Path (Get-Location) 'java/nex-reference/build/differential-classpath.txt'
          cargo test -p nf-nex-shadow --test differential --locked --offline -- --ignored
  release-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch only locked open-source Rust dependencies
        run: cargo fetch --locked
      - name: Build headless node
        run: cargo build --workspace --locked --offline --release
