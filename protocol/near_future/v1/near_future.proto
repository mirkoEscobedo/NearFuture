syntax = "proto3";
package nearfuture.protocol.v1;
option java_package = "org.nearfuture.protocol.v1";
option java_multiple_files = true;
option java_outer_classname = "NearFutureProtocol";
// WIRE ONLY. Never hash protobuf reserialization. Validate widths before use.
message UniverseId { bytes value = 1; }
message HistoryId { bytes value = 1; }
message AccountId { bytes value = 1; }
message DeviceId { bytes value = 1; }
message CampaignId { bytes value = 1; }
message BranchId { bytes value = 1; }
message EntityId { bytes value = 1; }
message AggregateId { bytes value = 1; }
message RequestId { bytes value = 1; }
message OperationId { bytes value = 1; }
message JobId { bytes value = 1; }
message ProviderId { bytes value = 1; }
message PeerId { bytes multihash = 1; }
message Sha256Digest { bytes value = 1; }
message AuthorityTerm { fixed64 value = 1; }
message RuntimeSession { fixed64 value = 1; }
message RulesetRevision { fixed64 value = 1; }
message WorldTick { fixed64 value = 1; }
message EventSequence { fixed64 value = 1; }
message AggregateRevision { fixed64 value = 1; }
message MembershipRevision { fixed64 value = 1; }
message ProtocolRange { uint32 minimum = 1; uint32 maximum = 2; }
message RequiredSemantics { repeated uint32 capability_ids = 1; repeated uint32 schema_ids = 2; }
message ResourceLimits {
  uint32 control_frame_bytes = 1; uint32 chunk_bytes = 2;
  uint32 inflight_bytes = 3; uint32 inflight_items = 4;
  uint32 decoded_bytes = 5; uint32 collection_items = 6;
  uint32 nesting_depth = 7; fixed64 transfer_bytes = 8;
}
message Handshake {
  ProtocolRange protocols = 1; RequiredSemantics required = 2;
  repeated uint32 optional_capability_ids = 3; UniverseId universe_id = 4;
  HistoryId history_id = 5; RuntimeSession runtime_session = 6;
  Sha256Digest ruleset_hash = 7; Sha256Digest content_policy_hash = 8;
  ResourceLimits limits = 9;
  // Local IPC only, exactly 32 unpredictable bytes; never log this field.
  bytes session_token = 10;
}
message NegotiatedSession {
  uint32 protocol_version = 1; RequiredSemantics semantics = 2;
  ResourceLimits limits = 3; RuntimeSession runtime_session = 4;
}
message HandshakeResult { oneof result { NegotiatedSession accepted = 1; BoundedError rejected = 2; } }
message Principal { AccountId account_id = 1; DeviceId device_id = 2; }
message AggregateVersion { AggregateId aggregate_id = 1; AggregateRevision revision = 2; }
// Local closed registry must recognize schema_id and validate canonical_body.
message SchemaPayload { uint32 schema_id = 1; bytes canonical_body = 2; }
message Intent {
  RequestId request_id = 1; Principal principal = 2; UniverseId universe_id = 3;
  HistoryId history_id = 4; uint32 operation_kind = 5;
  repeated AggregateVersion expected_revisions = 6; SchemaPayload payload = 7;
  Sha256Digest payload_digest = 8; optional fixed64 expires_at_tick = 9;
  RequiredSemantics required = 10; bytes signature = 11;
}
message QueryOperation {
  RequestId request_id = 1; Principal principal = 2;
  UniverseId universe_id = 3; HistoryId history_id = 4;
}
message CancelOperation { QueryOperation target = 1; RequestId cancellation_request_id = 2; }
enum OperationPhase {
  OPERATION_PHASE_UNSPECIFIED = 0; OPERATION_PHASE_ACCEPTED = 1;
  OPERATION_PHASE_PENDING = 2; OPERATION_PHASE_SUCCEEDED = 3;
  OPERATION_PHASE_REJECTED = 4; OPERATION_PHASE_CANCELLED = 5;
}
message OperationStatus {
  RequestId request_id = 1; OperationId operation_id = 2; HistoryId history_id = 3;
  Sha256Digest request_binding_digest = 4; OperationPhase phase = 5;
  oneof outcome { SchemaPayload success = 6; BoundedError error = 7; }
  EventSequence committed_event_seq = 8;
}
message EntityState { EntityId entity_id = 1; AggregateVersion aggregate = 2; SchemaPayload state = 3; }
message ModuleState { ProviderId provider_id = 1; uint32 state_version = 2; SchemaPayload state = 3; }
message ScheduledEvent { EntityId schedule_id = 1; WorldTick due_tick = 2; SchemaPayload event = 3; }
message Reservation { OperationId operation_id = 1; SchemaPayload state = 2; }
message DeduplicationEntry { RequestId request_id = 1; Sha256Digest binding_digest = 2; OperationStatus status = 3; }
message WorldSnapshot {
  UniverseId universe_id = 1; HistoryId history_id = 2; EventSequence event_seq = 3;
  WorldTick world_tick = 4; Sha256Digest ruleset_hash = 5;
  repeated AggregateVersion aggregate_revisions = 6; repeated EntityState entities = 7;
  repeated ModuleState module_state = 8; repeated ScheduledEvent scheduled_events = 9;
  repeated Reservation reservations = 10; repeated OperationStatus unresolved_operations = 11;
  repeated DeduplicationEntry deduplication_state = 12; Sha256Digest state_hash = 13;
  RequiredSemantics required = 14;
}
message Proposal {
  JobId job_id = 1; ProviderId provider_id = 2; uint32 provider_version = 3;
  Sha256Digest ruleset_hash = 4; Sha256Digest input_hash = 5;
  RuntimeSession runtime_session = 6; repeated AggregateVersion read_set = 7;
  repeated AggregateVersion write_set = 8; repeated SchemaPayload proposed_events = 9;
  repeated ModuleState module_state_delta = 10; RequiredSemantics required = 11;
}
message EventBatch {
  HistoryId history_id = 1; EventSequence event_seq = 2; Sha256Digest previous_hash = 3;
  AuthorityTerm authority_term = 4; WorldTick world_tick = 5; Sha256Digest ruleset_hash = 6;
  repeated OperationStatus request_outcomes = 7; repeated SchemaPayload events = 8;
  repeated ModuleState module_state_changes = 9; Sha256Digest state_hash = 10;
  RequiredSemantics required = 11;
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0; ERROR_CODE_MALFORMED = 1; ERROR_CODE_LIMIT_EXCEEDED = 2;
  ERROR_CODE_UNSUPPORTED_PROTOCOL = 3; ERROR_CODE_UNKNOWN_REQUIRED_SEMANTIC = 4;
  ERROR_CODE_HISTORY_MISMATCH = 5; ERROR_CODE_SESSION_MISMATCH = 6;
  ERROR_CODE_REQUEST_CONFLICT = 7; ERROR_CODE_UNAUTHORIZED = 8;
  ERROR_CODE_STALE_REVISION = 9; ERROR_CODE_BACKPRESSURE = 10;
}
message BoundedError {
  ErrorCode code = 1; string reason = 2;
  repeated uint32 unsupported_capability_ids = 3;
  repeated uint32 unsupported_schema_ids = 4; bool retryable = 5;
}
message TransportMetadata { optional fixed64 correlation_seq = 1; }
message ControlEnvelope {
  uint32 protocol_version = 1; RuntimeSession runtime_session = 2;
  RequiredSemantics required = 3;
  oneof body {
    Handshake handshake = 10; HandshakeResult handshake_result = 11; Intent intent = 12;
    QueryOperation query_operation = 13; CancelOperation cancel_operation = 14;
    OperationStatus operation_status = 15; Proposal proposal = 16;
    EventBatch event_batch = 17; BoundedError error = 18;
  }
  TransportMetadata transport = 30;
}
message SnapshotChunk {
  OperationId transfer_id = 1; uint32 chunk_index = 2; uint32 chunk_count = 3;
  fixed64 total_bytes = 4; Sha256Digest snapshot_digest = 5; bytes data = 6;
}
