tasks.register('authSocketClient', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'nf.adapter.ipc.AuthSocketClient'
    if (testJavaExecutable.isPresent()) executable = testJavaExecutable.get()
    doFirst {
        if (!providers.gradleProperty('ipcDescriptor').isPresent()) throw new GradleException('Owned descriptor required: -PipcDescriptor=...')
        args providers.gradleProperty('ipcDescriptor').get(), providers.gradleProperty('ipcEndpointRole').getOrElse('control')
    }
}
tasks.register('exportAuthTestClasspath') {
    dependsOn testClasses
    def target = layout.buildDirectory.file('auth-test-classpath.txt')
    outputs.file(target)
    doLast { target.get().asFile.text = sourceSets.test.runtimeClasspath.asPath }
}
