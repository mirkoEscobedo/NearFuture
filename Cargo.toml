[workspace]
members = [".", "crates/nf-contract", "crates/nf-wire", "crates/nf-kernel", "crates/nf-identity", "crates/nf-store", "crates/nf-nex-boundary", "crates/nf-ipc", "crates/nf-nex-shadow", "crates/nf-world", "crates/nf-transport", "crates/nf-world-driver"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "near-future"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nf-contract = { path = "crates/nf-contract" }
nf-identity = { path = "crates/nf-identity" }
nf-nex-shadow = { path = "crates/nf-nex-shadow" }

[dev-dependencies]
nf-nex-boundary = { path = "crates/nf-nex-boundary" }

[lints]
workspace = true

[profile.test.package."curve25519-dalek:4.1.3"]
opt-level = 3
debug-assertions = true
overflow-checks = true
